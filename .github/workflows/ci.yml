name: ci

# Every push (the default branch is feat/backend-bricks, not main) and every PR.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The whole job takes about 10 min locally (the API suite under 5, the
    # rooms 2.5, the db suite 1.5; nearly an hour before the suites ran their
    # files in parallel). 30 leaves room for a slower runner.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blockparty
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/blockparty
      # The test database is dropped and recreated from migrations on every run.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/blockparty_test
      TELEGRAM_BOT_TOKEN: "000:CI"
      INTERNAL_SECRET: ci-internal-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # vitest 5 needs ^22.12; miniflare needs >=22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      # Core, the database (races, loops and lock audits), the API (fuzzer and
      # the bundle on workerd), and the rooms on workerd.
      - run: pnpm test
      # The city has to build for production, not just typecheck.
      - run: pnpm --filter @bp/city build
        env:
          NEXT_PUBLIC_API_URL: https://api.ci.invalid
